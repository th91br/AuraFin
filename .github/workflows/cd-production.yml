name: CD — Production Database Release Gate

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-production:
    name: Production Release
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Strict Verification Gate (Lint & Build)
        run: |
          npm run test:deployment
          npm run build
        env:
          VITE_SUPABASE_URL: https://ci-validation.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_validation_only_00000000
          VITE_APP_ENV: production

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Production Database Credentials
        shell: bash
        run: |
          missing=0
          for variable in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID_PRODUCTION SUPABASE_DB_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Required production credential is not configured: $variable"
              missing=1
            fi
          done
          exit "$missing"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID_PRODUCTION: ${{ secrets.SUPABASE_PROJECT_ID_PRODUCTION }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PRODUCTION }}

      - name: Apply Migrations to Production Supabase
        run: |
          echo "Connecting to Supabase Production..."
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID_PRODUCTION }}
          echo "Applying versioned migrations to Production..."
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID_PRODUCTION: ${{ secrets.SUPABASE_PROJECT_ID_PRODUCTION }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PRODUCTION }}

      - name: Production Release Gate Status
        run: echo "Production database migrations completed. Frontend hosting is handled separately by Vercel."
